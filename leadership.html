<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أفضل دور قيادي - نادي نسمو</title>

<style>
:root{--navy:#004165;--maroon:#772432;--bg:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#fff,var(--bg));color:#17212b}
.wrap{width:min(760px,calc(100% - 28px));margin:24px auto;text-align:center}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 14px 35px rgba(0,65,101,.14);border-top:8px solid var(--maroon)}
.logo{width:min(330px,85vw);max-height:210px;object-fit:contain}
h1{color:var(--navy);font-size:clamp(28px,6vw,44px);margin:16px 0}
.qr{width:min(360px,85%);display:block;margin:12px auto;background:#fff}
.btn{display:inline-block;background:var(--maroon);color:#fff;text-decoration:none;padding:14px 24px;border-radius:12px;font-weight:bold;font-size:20px}
.note{color:#667085;margin-top:14px}
.back{display:inline-block;margin-top:18px;color:var(--navy);text-decoration:none;font-weight:bold}
</style>

</head>
<body>
<main class="wrap">
  <section class="card">
    <img class="logo" src="nasmu-logo.png" alt="شعار نادي نسمو">
    <h1>أفضل دور قيادي</h1>
    <img class="qr" src="leadership.png" alt="رمز QR للتصويت">
    <a class="btn" href="https://forms.gle/TgcStbdTb2zqxC1S7" target="_blank" rel="noopener">فتح نموذج التصويت</a>
    <p class="note">هذه الصفحة خاصة بهذه الفقرة فقط.</p>
  </section>
</main>
</body>
</html>
